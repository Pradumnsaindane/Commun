<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Commun</title>
  <meta name="description" content="Reset your Commun account credentials.">
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="bg-mesh">
    <div class="glow-orb glow-orb-1"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card card-glow">
      <div class="auth-header">
        <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 1.25rem;">
          <div class="logo-symbol"><span class="logo-inner"></span></div>
          <span class="brand-text">Commun<span class="text-accent">.</span></span>
        </a>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your email and we'll send a magic recovery link</p>
      </div>

      <form class="auth-form" onsubmit="handleReset(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="input-field" placeholder="engineer@domain.com" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login.html" class="text-accent">← Return to Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="/main.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      if (typeof showToast === 'function') {
        showToast('Password reset link sent to your inbox!');
      }
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 1500);
    }
  </script>
</body>
</html>
