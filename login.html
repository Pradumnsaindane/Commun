<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Commun Developer SaaS Platform</title>
  <meta name="description" content="Sign in to your Commun developer workspace, connect with builders, and collaborate on projects.">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/page-shell.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="bg-mesh">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card card-glow">
      <div class="auth-header">
        <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 1.25rem;">
          <div class="logo-symbol"><span class="logo-inner"></span></div>
          <span class="brand-text">Commun<span class="text-accent">.</span></span>
        </a>
        <h1 class="auth-title">Welcome back, builder</h1>
        <p class="auth-subtitle">Sign in to your account or enterprise workspace</p>
      </div>

      <!-- OAuth Providers -->
      <div class="oauth-buttons-grid">
        <button class="btn btn-secondary oauth-btn" onclick="simulateOAuth('GitHub')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          Continue with GitHub
        </button>
        <button class="btn btn-secondary oauth-btn" onclick="simulateOAuth('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          Continue with Google
        </button>
      </div>

      <div class="auth-divider">
        <span>or sign in with email</span>
      </div>

      <form class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Work or Developer Email</label>
          <input type="email" class="input-field" placeholder="elena@hyperscale.ai" required value="elena@hyperscale.ai">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label">Password</label>
            <a href="/forgot-password.html" class="text-accent" style="font-size: 0.8rem;">Forgot password?</a>
          </div>
          <input type="password" class="input-field" placeholder="••••••••••••" required value="password123">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In to Commun
        </button>
      </form>

      <div class="auth-footer">
        <span>Don't have an account?</span>
        <a href="/register.html" class="text-accent">Create an account</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      if (typeof showToast === 'function') {
        showToast('Authenticating credentials...');
      }
      setTimeout(() => {
        window.location.href = '/workspace.html';
      }, 800);
    }
    function simulateOAuth(provider) {
      if (typeof showToast === 'function') {
        showToast(`Connecting with ${provider}...`);
      }
      setTimeout(() => {
        window.location.href = '/feed.html';
      }, 900);
    }
  </script>
</body>
</html>
