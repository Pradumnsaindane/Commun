name: Deployment Smoke Tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Deployment URL (e.g., https://commun.dev or preview URL)'
        required: true
        type: string
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - preview
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'manual' }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Deployment Smoke Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Smoke Test Suite
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          echo "Running smoke tests against target: ${{ inputs.target_url }}"
          npm run test:smoke -- --url="${{ inputs.target_url }}"

      - name: Publish Smoke Test Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Smoke Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target URL**: \`${{ inputs.target_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
